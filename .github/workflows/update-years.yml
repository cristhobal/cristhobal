name: Update years of experience

on:
  schedule:
    - cron: "0 0 1 1 *" # corre cada 1 de enero
  workflow_dispatch: # también se puede correr manual

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate and update years
        run: |
          START_YEAR=2021
          CURRENT_YEAR=$(date +%Y)
          YEARS=$((CURRENT_YEAR - START_YEAR))
          sed -i "s/<!-- YEARS -->[0-9]*<!-- \/YEARS -->/<!-- YEARS -->$YEARS<!-- \/YEARS -->/" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git add README.md && git commit -m "chore: update years of experience" && git push)
